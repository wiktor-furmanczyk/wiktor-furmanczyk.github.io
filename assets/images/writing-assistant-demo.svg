    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#824cff"/><stop offset="1" stop-color="#14c7f1"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#112049"/><stop offset="1" stop-color="#07132d"/></linearGradient>
