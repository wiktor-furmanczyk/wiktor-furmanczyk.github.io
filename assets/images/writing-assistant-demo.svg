<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc">
  <title id="title">AI Writing Assistant</title>
  <desc id="desc">Przykładowy ekran korekty wiadomości z panelami zmiany stylu i tłumaczenia.</desc>
  <defs>
